name: Build Exotic Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exotic-Music-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Exotic Music v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### 🎵 Exotic Music App Release (JioSaavn Live Streaming + Taste Onboarding)
            - **JioSaavn Real-time Streaming**: Direct high-speed 320kbps lossless playback, dynamic multi-language search, live home feed, infinite suggestions queue!
            - **First-Time User Onboarding Flow**: 3-step modern setup (Welcome, Language Preferences, Favorite Artist Selection).
            - **Settings Taste Customizer**: Easily update preferred music languages and favorite artists anytime in Settings.
            - **Brand New Orange Identity**: Updated app logo and launcher icons across all screen densities.
            - **4 Core Tab Navigation**: Home, Search, Library, Settings.
            - **Offline-ready Persistence**: Full Song JSON state caching for liked songs, playlists, and recently played.
            - Download and install the APK below!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

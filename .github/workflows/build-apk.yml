name: Build Exotic Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if flutter build apk --release --android-skip-build-dependency-validation; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Build failed, retrying in 30 seconds..."
              sleep 30
            else
              echo "Build failed after 3 attempts"
              exit 1
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exotic-Music-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Exotic Music v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### 🎵 Exotic Music App — Build ${{ github.run_number }}
            - **Hybrid Music Engine**: JioSaavn primary + YouTube direct audio fallback (transparent, ad-free)
            - **Local Music Library**: Device audio files classified into All Songs, Artists, Albums, Favorites
            - **Dynamic Taste Recommendations**: Personalized home feed based on selected languages & artists
            - **Accurate Artist Classification**: Hindi, Punjabi & International properly separated
            - **Smart Search**: Recent searches history + Your Favorites chips (no fake trending)
            - **Lyrics Auto-Scroll**: Active lyric line smoothly centered in viewport
            - **User Profile**: Shows real username from onboarding throughout the app
            - Download and install the APK below!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
